# Long-lived streamable-HTTP MCP server for LAN / Tailscale / Synology.
# Binds to loopback by default — do not expose this port to the public internet.
#
# Usage:
#   docker compose up -d --build
#   # MCP endpoint: http://127.0.0.1:8000/mcp
#
# Optional station token (never commit the real value):
#   Put BIRDWEATHER_STATION_TOKEN in a mode-600 .env and uncomment env_file below.
#   Do not inline the token in this file.
#
# Host headers (MagicDNS / LAN hostname → avoid 421 Invalid Host header):
#   MCP_ALLOWED_HOSTS=nas.example.local:*
#   MCP_ALLOWED_HOSTS=*   # trusted networks only
#
# arm64 (e.g. Synology DS223j): prefer buildx off-NAS, export a .tar, import in
# Container Manager — see docs/self-hosting.md.

services:
  birdweather-mcp:
    build: .
    image: birdweather-mcp:local
    container_name: birdweather-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    # Prefer a mode-600 .env (see docs/self-hosting.md). Compose also reads .env
    # next to this file for ${BIRDWEATHER_STATION_TOKEN} interpolation.
    # env_file:
    #   - .env
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      # Optional — enables station REST API. Never logged by the server.
      BIRDWEATHER_STATION_TOKEN: ${BIRDWEATHER_STATION_TOKEN:-}
      # Optional: MCP_ALLOWED_HOSTS=nas.example.local:*
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
