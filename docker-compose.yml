# Long-lived streamable-HTTP MCP server for LAN / Tailscale / Synology.
# Binds to loopback by default — do not expose this port to the public internet.
#
# Usage:
#   docker compose up -d --build
#   # MCP endpoint: http://127.0.0.1:8000/mcp
#
# Optional station token (never commit the real value):
#   export BIRDWEATHER_STATION_TOKEN=your_token
#   # or create a local .env (gitignored) with BIRDWEATHER_STATION_TOKEN=...
#
# arm64 (e.g. Synology DS223j): build on the NAS, or:
#   docker buildx build --platform linux/arm64 -t birdweather-mcp:local --load .

services:
  birdweather-mcp:
    build: .
    image: birdweather-mcp:local
    container_name: birdweather-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8000"
      # Optional — enables station REST API. Never logged by the server.
      BIRDWEATHER_STATION_TOKEN: ${BIRDWEATHER_STATION_TOKEN:-}
    # env_file: .env
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
