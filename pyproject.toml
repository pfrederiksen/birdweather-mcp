[project]
name = "birdweather-mcp"
version = "0.2.4"
description = "Self-hostable MCP server for BirdWeather stations (detections, species, stats)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Paul Frederiksen", email = "pfrederiksen@users.noreply.github.com" }]
keywords = ["mcp", "birdweather", "birds", "birdnet", "model-context-protocol"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.17"]

[project.scripts]
birdweather-mcp = "birdweather_mcp.server:main"

[project.urls]
Homepage = "https://github.com/pfrederiksen/birdweather-mcp"
Documentation = "https://github.com/pfrederiksen/birdweather-mcp#readme"
Repository = "https://github.com/pfrederiksen/birdweather-mcp"
Issues = "https://github.com/pfrederiksen/birdweather-mcp/issues"
Changelog = "https://github.com/pfrederiksen/birdweather-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdweather_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/LICENSE",
  "/README.md",
  "/CHANGELOG.md",
  "/server.json",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "live: hits the public BirdWeather API (deselect with -m 'not live')",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.17.5",
]
