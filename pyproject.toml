[project]
name = "birdweather-mcp"
version = "0.1.0"
description = "Self-hostable MCP server for BirdWeather stations (detections, species, stats)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Paul Frederiksen" }]
keywords = ["mcp", "birdweather", "birds", "birdnet"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[project.scripts]
birdweather-mcp = "birdweather_mcp.server:main"

[project.urls]
Homepage = "https://github.com/pfrederiksen/birdweather-mcp"
Repository = "https://github.com/pfrederiksen/birdweather-mcp"
Issues = "https://github.com/pfrederiksen/birdweather-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdweather_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "live: hits the public BirdWeather API (deselect with -m 'not live')",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]
