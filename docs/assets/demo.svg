<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">birdweather-mcp demo conversation</title>
  <desc id="desc">Example chat asking about Example Station 12345 detections with placeholder data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2f28"/>
      <stop offset="55%" stop-color="#243f36"/>
      <stop offset="100%" stop-color="#3d5a4c"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3ea"/>
      <stop offset="100%" stop-color="#ebe4d6"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1612" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>
  <!-- soft foliage shapes -->
  <circle cx="70" cy="480" r="120" fill="#2f4a3f" opacity="0.55"/>
  <circle cx="900" cy="40" r="140" fill="#2a4439" opacity="0.45"/>
  <circle cx="820" cy="500" r="90" fill="#4a6b58" opacity="0.25"/>

  <text x="48" y="52" fill="#d8e5dd" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700">birdweather-mcp</text>
  <text x="48" y="78" fill="#a9c0b4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Ask your AI what station 12345 has been hearing</text>

  <rect x="48" y="108" width="864" height="380" rx="18" fill="url(#panel)" filter="url(#soft)"/>

  <!-- user bubble -->
  <rect x="420" y="140" width="460" height="64" rx="14" fill="#2f5d4a"/>
  <text x="440" y="168" fill="#f4faf6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">What has Example Station been hearing this week?</text>
  <text x="440" y="188" fill="#c5ddd2" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">station_id 12345 · last 7 days</text>

  <!-- assistant bubble -->
  <rect x="80" y="230" width="620" height="210" rx="14" fill="#ffffff" stroke="#d7cfbf"/>
  <text x="100" y="258" fill="#1f2a24" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">Assistant</text>
  <text x="100" y="286" fill="#334038" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Called top_species + station_counts for Example Station.</text>
  <text x="100" y="312" fill="#334038" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">• House Finch — 273 detections</text>
  <text x="100" y="334" fill="#334038" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">• Anna&#39;s Hummingbird — 51</text>
  <text x="100" y="356" fill="#334038" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">• ~497 detections · 31 species</text>
  <text x="100" y="386" fill="#5b6b62" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Timezone America/Los_Angeles · placeholder sample data</text>
  <text x="100" y="412" fill="#2f5d4a" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">soundscape.url available on recent_detections when present</text>

  <text x="48" y="520" fill="#8eaa9b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11">Demo illustration · no live station data</text>
</svg>
